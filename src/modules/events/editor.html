<section id="eventFields" hidden aria-labelledby="eventHeading">
              <h3 id="eventHeading">Event details</h3>
              <label class="check"><input id="dateOnly" type="checkbox"> Date only; a time has not been announced</label>
              <p class="small muted">Enter local Pacific time. Daylight saving time is applied automatically. If a time falls in the repeated or missing hour when clocks change, choose a clear time or add a note.</p>
              <div class="grid">
                <div><label for="start">Starts (Pacific time)</label><input id="start" type="datetime-local"></div>
                <div><label for="end">Ends (Pacific time, optional)</label><input id="end" type="datetime-local"></div>
                <div><label for="venue">Venue</label><input id="venue" maxlength="500"></div>
                <div><label for="eventCity">City</label><input id="eventCity" maxlength="120"></div>
                <div><label for="eventCounty">County</label><input id="eventCounty" list="countyOptions" maxlength="120"></div>
                <div><label for="eventKind">Event type</label><input id="eventKind" maxlength="120" placeholder="Community event"></div>
                <div><label for="organizer">Organizer</label><input id="organizer" maxlength="200"></div>
                <div><label for="audience">Who can attend</label><input id="audience" maxlength="1000"></div>
                <div><label for="eventImage">Event image URL (optional)</label><input id="eventImage" type="url" maxlength="2000" placeholder="https://"></div>
                <div><label for="source">Original event information</label><input id="source" type="url" maxlength="2000" placeholder="https://"></div>
                <div><label for="sourceChecked">Date source was checked</label><input id="sourceChecked" type="date"></div>
                <div><label for="sourceKind">Source type</label><select id="sourceKind"><option value="">Not recorded</option><option value="public_source">Public source</option><option value="project_team">Project team</option></select></div>
                <div><label for="sourceNote">Source and verification notes</label><textarea id="sourceNote" maxlength="2000"></textarea></div>
              </div>
              <label for="timeNote">Attendance and timing notes</label><textarea id="timeNote" maxlength="2000"></textarea>
              <p class="small muted">A source-check date requires a source URL. Leave the date blank for an unverified draft.</p>
            </section>
